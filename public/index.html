<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Radar</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Pick the theme before the page paints: your choice, or your Mac's setting.
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/resume.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#today" aria-label="Job Radar">
        <img src="/icon.svg" alt="" width="22" height="22">
        <span>Job Radar</span>
      </a>
      <nav class="nav" aria-label="Sections">
        <a href="#today" data-tab="today" data-label="Today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Today</span></a>
        <a href="#jobs" data-tab="jobs" data-label="Jobs"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg><span>Jobs</span></a>
        <a href="#quick" data-tab="quick" data-label="Any job"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg><span>Any job</span></a>
        <a href="#applications" data-tab="applications" data-label="Applications"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v16H4zM14 4h6v10h-6z"/></svg><span>Applications</span></a>
        <a href="#practice" data-tab="practice" data-label="Practice"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M13 5l-2 14"/></svg><span>Practice</span></a>
        <a href="#stats" data-tab="stats" data-label="Stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Stats</span></a>
        <a href="#sources" data-tab="sources" data-label="Companies"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-6h6v6"/></svg><span>Companies</span></a>
        <a href="#settings" data-tab="settings" data-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Settings</span></a>
        <a href="#help" data-tab="help" data-label="Help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg><span>Help</span></a>
      </nav>
      <div class="sidebar-foot">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">
          <span class="tt-track"><span class="tt-knob">
            <svg class="tt-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="tt-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          </span></span>
          <span class="tt-label">Dark mode</span>
        </button>
        <a class="side-link" href="#settings/devices"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>Use on laptop</a>
        <div class="status" id="status" aria-live="polite"></div>
        <button class="btn btn-sm btn-ghost" id="checkNow" type="button">Check now</button>
      </div>
    </aside>
    <main class="main" id="view"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
